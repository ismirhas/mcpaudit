[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpaudit"
version = "0.1.0"
description = "Static security audit of MCP and AI-agent configuration files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ismir Hasanbegović" }]
keywords = ["mcp", "ai-security", "llm", "agents", "security", "sarif"]
dependencies = []

[project.scripts]
mcpaudit = "mcpaudit.cli:main"

[tool.setuptools]
packages = ["mcpaudit"]
